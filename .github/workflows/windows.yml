name: Windows - OpenGL

on:
  push:
    branches:
      - Init
  pull_request:
    branches:
      - Init

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2

      - name: Download Intel OpenCL SDK (Windows)
        run: |
          curl -L -o opencl_sdk.zip https://github.com/intel/compute-runtime/releases/download/24.17.27041.6/intel_sdk_for_opencl_windows_2020.2.487.zip
          tar -xf opencl_sdk.zip
        shell: pwsh

      - name: Set up OpenCL env
        run: |
          echo "INCLUDE=$env:GITHUB_WORKSPACE/intel_sdk_for_opencl_windows_2020.2.487/include" >> $env:GITHUB_ENV
          echo "LIB=$env:GITHUB_WORKSPACE/intel_sdk_for_opencl_windows_2020.2.487/lib/x64" >> $env:GITHUB_ENV
          echo "$env:GITHUB_WORKSPACE/intel_sdk_for_opencl_windows_2020.2.487/bin/x64" >> $env:GITHUB_PATH
        shell: pwsh
        
      - uses: abel0b/setup-premake@v2.4
        with:
          version: "5.0.0-beta2"

      - name: Get Submodules
        run: git submodule update --init

      - name: Compile (Premake)
        run: |
          premake5 --os=windows --file=build/premake5.lua vs2022
          msbuild program-solution.sln /p:Configuration=Debug /p:Platform=x64
