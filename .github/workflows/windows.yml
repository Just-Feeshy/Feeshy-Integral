name: Windows - OpenGL

on:
  push:
    branches:
      - Init
  pull_request:
    branches:
      - Init

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2

      - name: Install OpenCL
        run: |
          choco install opencl-intel-cpu-runtime -y
          choco install opencl-headers -y
      
      - name: Verify OpenCL installation
        run: |
          clinfo
        
      - uses: abel0b/setup-premake@v2.4
        with:
          version: "5.0.0-beta2"

      - name: Get Submodules
        run: git submodule update --init

      - name: Compile (Premake)
        run: |
          premake5 --os=windows --file=build/premake5.lua vs2022
          msbuild program-solution.sln /p:Configuration=Debug /p:Platform=x64
