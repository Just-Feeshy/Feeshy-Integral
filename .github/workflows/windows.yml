name: Windows - OpenGL
on:
  push:
    branches:
      - Init
  pull_request:
    branches:
      - Init

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - uses: abel0b/setup-premake@v2.4
        with:
          version: "5.0.0-beta2"

      - name: Get Submodules
        run: git submodule update --init

      - name: Setup OpenCL
        run: |
          # Install Intel OpenCL runtime
          choco install opencl-intel-cpu-runtime -y
          
          # Download and install OpenCL headers
          Invoke-WebRequest -Uri "https://github.com/KhronosGroup/OpenCL-Headers/archive/refs/heads/main.zip" -OutFile "opencl-headers.zip"
          Expand-Archive -Path "opencl-headers.zip" -DestinationPath "temp"
          
          # Create OpenCL directory
          New-Item -ItemType Directory -Force -Path "C:\OpenCL\include"
          Copy-Item -Path "temp\OpenCL-Headers-main\CL" -Destination "C:\OpenCL\include" -Recurse
          
          # Clean up
          Remove-Item "opencl-headers.zip" -Force
          Remove-Item "temp" -Recurse -Force
          
          # Verify installation (The testcases fail too much)
          if (Test-Path "C:\OpenCL\include\CL\cl.h") {
              Write-Host "✅ OpenCL headers installed successfully"
          } else {
              Write-Host "❌ OpenCL headers installation failed"
              exit 1
          }

      - name: Generate Visual Studio Solution
        run: |
          premake5 --os=windows --file=build/premake5.lua vs2022

      - name: Build with MSBuild
        run: |
          msbuild program-solution.sln /p:Configuration=Debug /p:Platform=x64 /p:IncludePath="C:\OpenCL\include;$(IncludePath)"
