name: Windows - OpenGL

on:
  push:
    branches:
      - Init
  pull_request:
    branches:
      - Init

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2

      - name: Install OpenCL SDK (Windows)
        run: |
          New-Item -ItemType Directory -Force -Path "third_party\opencl_headers\CL"
          
          $headers = @{
              "cl.h" = "https://raw.githubusercontent.com/KhronosGroup/OpenCL-Headers/main/CL/cl.h"
              "cl_platform.h" = "https://raw.githubusercontent.com/KhronosGroup/OpenCL-Headers/main/CL/cl_platform.h"
              "opencl.h" = "https://raw.githubusercontent.com/KhronosGroup/OpenCL-Headers/main/CL/opencl.h"
          }
          
          foreach ($header in $headers.GetEnumerator()) {
              Write-Host "Downloading $($header.Key)..."
              Invoke-WebRequest -Uri $header.Value -OutFile "third_party\opencl_headers\CL\$($header.Key)"
          }
          
          echo "OPENCL_INCLUDE_DIR=$env:GITHUB_WORKSPACE\third_party\opencl_headers" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "OPENCL_HEADERS_ONLY=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        shell: powershell
        
      - uses: abel0b/setup-premake@v2.4
        with:
          version: "5.0.0-beta2"

      - name: Get Submodules
        run: git submodule update --init

      - name: Compile (Premake)
        run: |
          premake5 --os=windows --file=build/premake5.lua vs2022
          msbuild program-solution.sln /p:Configuration=Debug /p:Platform=x64
