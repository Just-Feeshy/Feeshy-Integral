name: Windows - OpenGL

on:
  push:
    branches:
      - Init
  pull_request:
    branches:
      - Init

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - uses: abel0b/setup-premake@v2.4
        with:
          version: "5.0.0-beta2"

      - name: Setup MSYS2 build environment
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-opencl-headers
            mingw-w64-x86_64-opencl-icd-loader
            mingw-w64-x86_64-pkg-config

      - name: Install OpenCL runtime
        run: choco install opencl-intel-cpu-runtime -y
        
      - name: Get Submodules
        run: git submodule update --init

      - name: Compile (Premake)
        run: |
          premake5 --os=windows --file=build/premake5.lua gmake

      - name: Compile (VS2022)
        shell: msys2 {0}
        run: |
          msbuild program-solution.sln /p:Configuration=Debug /p:Platform=x64
